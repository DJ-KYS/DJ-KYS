<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
</head>
<body>
    <h1>FORMS</h1>

    <form>
        <label for="button">button</label><br>
        <input type="button" value="SAVE"><br>
        <label for="checkbox">checkbox</label><br>
        <input type="checkbox" name="checkbox" id="checkbox"><br>
        <label for="color">color</label><br>
        <input type="color"><br>
        <label for="Date">Date</label><br>
        <input type="date"><br>
        <label for="datetime-Local">Datetime-local</label><br>
        <input type="datetime-local"><br>
        <label for="email">email</label><br>
        <input type="email"><br>
        <label for="file">file</label><br>
        <input type="file" multiple><br>
        <label for="hidden">hidden</label><br>
        <input type="hidden"><br>
        <label for="image">image</label><br>
        <input type="image"><br>
        <label for="month">month</label><br>
        <input type="month"><br>
        <label for="numbers">numbers</label><br>
        <input type="number"><br>
        <label for="password">password</label><br>
        <input type="password"><br>
        <label for="radio">radio</label><br>
        <input type="radio"><br>
        <label for="range">range</label><br>
        <input type="range"><br>
        <label for="reset">reset</label><br>
        <input type="reset"><br>
        <label for="search">search</label><br>
        <input type="search"><br>
        <label for="submit">submit</label><br>
        <input type="submit"><br>
        <label for="tel">tel</label><br>
        <input type="tel"><br>
        <label for="text">text</label><br>
        <input type="text" placeholder="enter your name"><br>
        <label for="text">text</label><br>
        <input type="text" value="john" readonly><br>
        <label for="time">time</label><br>
        <input type="time"><br>
        <label for="url">url</label><br>
        <input type="url"><br>
        <label for="week">week</label><br>
        <input type="week"><br>
        <label for="pin">PIN</label><br>
        <input type="text" id="pin" name="pin" maxlength="6"><br>
        <label for="pin">PIN</label><br>
        <input type="text" id="pin" name="pin" ><br>
        

    </form>
</body>
</html>
