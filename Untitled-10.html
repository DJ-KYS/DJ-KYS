<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0%;
            padding: 0%;
        }

        body {
            margin: 0;
            background: #1e1e1e;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            width: 320px; 
            padding:20px;
            background: #2c2c2c; 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 10px
        }
        
        .display {
            width: 100%;
            height: 60px;
            font-size: 28px;
            text-align: right;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            background: #f4f4f4;
        }

        .expression {
            text-align: left; 
            font-size:20px; 
            color: black;
        }

        .answer {
            text-align: right; 
            font-size: 30px; 
            font-weight: bold;
            color: black;
        }

        .buttons {
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px;
        }

        button {
            height: 60px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #444;
            color: white;
            transition: 0.2s;
        }

        .clear {
            grid-column: span 1;
        }

        .equal {
            grid-column: span 1; 
            background:#222; 
            color: white
        }

        button:hover {
            background: #666;
        }

        .equal {
            background: #28a745;
        }

        .equal:hover {
            background: #34c759;
        }

        .clear {
            background: #dc3545;
        }

        .clear:hover {
            background: #ff4d5a;
        }
    </style>    
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression">3 x 3</div>
            <div class="answer">9</div>
        </div>

        <div class="buttons">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>x</button>

            <button type="reset">Clear</button>
            <button>0</button>
            <button class="equal">=</button>
            <button>÷</button>
        </div>
    </div>

</body>
</html>
